const stage=document.getElementById('stage'),stars=document.getElementById('stars'),fx=document.getElementById('fx'),wish=document.getElementById('wish'),sil=document.getElementById('silhouette'),hint=document.getElementById('hint'),msg=document.getElementById('starMessage'),pent=document.getElementById('pentagram');const sctx=stars.getContext('2d'),fctx=fx.getContext('2d');let W,H,DPR,points=[],phase=0,fw=[],fireworkStart=0;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;for(const c of [stars,fx]){c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px'}sctx.setTransform(DPR,0,0,DPR,0,0);fctx.setTransform(DPR,0,0,DPR,0,0);makeStars()}function makeStars(){points=[];const n=Math.floor(W*H/8500);for(let i=0;i<n;i++)points.push({x:Math.random()*W,y:Math.random()*H*.78,r:Math.random()*1.15+.15,a:Math.random()*.75+.15,t:Math.random()*6.28,s:Math.random()*.7+.2})}function drawStars(t){sctx.clearRect(0,0,W,H);for(const p of points){const a=p.a*(.55+.45*Math.sin(t*.001*p.s+p.t));sctx.globalAlpha=a;sctx.fillStyle='#fff';sctx.beginPath();sctx.arc(p.x,p.y,p.r,0,Math.PI*2);sctx.fill()}sctx.globalAlpha=1}function particle(x,y,ang,speed,life,size,alpha){fw.push({x,y,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,life,max:life,size,alpha})}function burst(x,y){const count=55+Math.random()*30;for(let i=0;i<count;i++)particle(x,y,Math.random()*Math.PI*2,Math.random()*3.2+1.2,70+Math.random()*55,Math.random()*1.6+.4,.85)}function drawFx(){fctx.clearRect(0,0,W,H);for(let i=fw.length-1;i>=0;i--){const p=fw[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.018;p.vx*=.992;p.vy*=.992;p.life--;const a=Math.max(0,p.life/p.max)*p.alpha;fctx.globalAlpha=a;fctx.fillStyle='#f7dba0';fctx.shadowBlur=8;fctx.shadowColor='#f6d18b';fctx.beginPath();fctx.arc(p.x,p.y,p.size,0,Math.PI*2);fctx.fill();if(p.life<=0)fw.splice(i,1)}fctx.globalAlpha=1;fctx.shadowBlur=0}function fireworks(t){if(t-fireworkStart<5200&&Math.random()<.045)burst(W*(.15+Math.random()*.7),H*(.13+Math.random()*.38))}function loop(t){drawStars(t);drawFx();if(phase===2)fireworks(t);requestAnimationFrame(loop)}resize();addEventListener('resize',resize);requestAnimationFrame(loop);stage.addEventListener('click',()=>{if(phase===0){phase=1;wish.classList.add('show');hint.style.opacity='0'}else if(phase===1){phase=2;fireworkStart=performance.now();hint.style.opacity='0';sil.style.opacity='.55';setTimeout(()=>{phase=3;fw=[];msg.classList.add('show');pent.classList.add('show');setTimeout(()=>msg.classList.remove('show'),3400)},5400)}});
</script></body></html>
